; ESP32 e-paper sidescreen firmware (protocol v1)
; Build:  pio run -e waveshare_esp32  |  pio run -e esp32s3  |  pio run -e waveshare_esp32_42tri
;         (diagnostic only: pio run -e waveshare_esp32_42tri_calib)
; Flash:  pio run -e <env> -t upload      |  Monitor: pio device monitor -e <env>
;
; Panel model and pins are selected in include/config.h.

[platformio]
default_envs = waveshare_esp32

[env]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    zinggjm/GxEPD2 @ ^1.6.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.16.1
    olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -Wall

; Waveshare e-Paper ESP32 Driver Board (ESP32-WROOM-32, on-board FPC socket).
; Fixed pins: SCK=13 DIN=14 CS=15 DC=27 RST=26 BUSY=25 (remapped onto the SPI bus).
[env:waveshare_esp32]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_WAVESHARE_ESP32

; Production three-colour build (also the only one with WiFi: -DENABLE_WIFI=1,
; TCP 7330 / UDP 7331 / NVS, see include/config.h): same Waveshare ESP32 Driver Board with the
; 4.2" 400x300 three-colour panel used in this project (black/white +
; red/yellow). Own driver in src/epd_tri.cpp: bit-banged SPI on SCK13/DIN14,
; always full refresh, >= 180 s from the end of one refresh to the next.
; Driver parameters pinned to the ones the real panel showed correctly in the
; calibration run on this panel: fixed v2_old path (no
; 0x2F read-back) and the red/yellow plane sent to 0x13 unchanged. Normal
; boot screen + dashboard (no calibration frame). These -D flags override the
; generic defaults in include/config.h §4 (auto_v2, ry_invert 1), which stay
; as they are for other three-colour panels. To change one, edit the value
; here; do not add a second -D for the same macro.
[env:waveshare_esp32_42tri]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_WAVESHARE_ESP32
    -DEPD_PANEL=4
    -DEPD_TRI_PROFILE=2
    -DEPD_TRI_V2_OLD_RY_INVERT=0
    -DEPD_TRI_TEST_PATTERN=0
    -DENABLE_WIFI=1

; Diagnostic build for the "whole screen red, no text" symptom, see
; firmware/README.md section 9.5a. Same board and panel. The only
; driver parameter changed against the observed run is ry_invert: the
; red/yellow plane is sent to 0x13 unchanged (vendor EPD_4in2b_V2_old /
; EPD_4in2bc convention). Also: the path is pinned to the v2_old path that
; run used (so no 0x2F read-back), and the boot screen is the three-band
; calibration frame. Diagnostic only; for daily use flash
; waveshare_esp32_42tri, which uses the same driver parameters.
[env:waveshare_esp32_42tri_calib]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_WAVESHARE_ESP32
    -DEPD_PANEL=4
    -DEPD_TRI_PROFILE=2
    -DEPD_TRI_V2_OLD_RY_INVERT=0
    -DEPD_TRI_TEST_PATTERN=1

; Generic ESP32-S3 DevKitC + e-paper adapter wired with jumper cables.
; Pins: see include/config.h (default SCK=12 MOSI=11 CS=10 DC=9 RST=8 BUSY=7).
; Uses the native USB port (USB CDC), plug the cable into the "USB" port, not "UART".
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
